# Gradle performance
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.1.2

# Mod (Gradle coordinates only; manifest values live in pkl/mod.pkl)
mod_id=modid
mod_name=Modid
mod_group=com.example.modid
mod_version=1.0.0
mod_license=MIT
mod_authors=yourname
mod_description=A multiloader example built from one Pkl source.

# Fabric
fabric_loader_version=0.19.3

# NeoForge
neo_version=26.1.2.73

# Languages (dependency coordinates only). Plugin versions live in the root
# build.gradle.kts plugins block; keep kotlin_version in sync with the
# kotlin.jvm plugin version there.
kotlin_version=2.4.0
scala_version=3.8.3
