# Gradle performance
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.1.2

# Mod (Gradle coordinates only; manifest values live in pkl/mod.pkl)
mod_id=modid
mod_name=Modid
mod_group=com.example.modid
mod_version=1.0.0
mod_license=MIT
mod_authors=yourname
mod_description=A multiloader example built from one Pkl source.

# Fabric
fabric_loader_version=0.19.3
loom_version=1.16-SNAPSHOT
fabric_api_version=0.150.0+26.1.2

# NeoForge (used in Stage B)
neo_version=26.1.2.73
minecraft_version_range=[26.1.2,)
neo_version_range=[26.1.2.73,)

# Language plugins (re-enabled when the polyglot source sets land in Stage D)
kotlin_version=2.4.0
scala_version=3.8.3
fabric_kotlin_version=1.13.12+kotlin.2.4.0
