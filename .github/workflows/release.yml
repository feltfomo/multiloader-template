# tags publish the standalone bootstrap and its checksum
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: verify bootstrap version
        run: grep -F 'const release_ref = "${{ github.ref_name }}"' create-mc-mod.nu

      - name: create checksum
        run: sha256sum create-mc-mod.nu > create-mc-mod.nu.sha256

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            create-mc-mod.nu \
            create-mc-mod.nu.sha256 \
            --verify-tag \
            --generate-notes \
            --title "${{ github.ref_name }}"