# ci builds generated projects because those are what users receive
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mod_id: cijava
            language: java
            side: both
            extra: ''
          - mod_id: cikotlin
            language: kotlin
            side: server
            extra: --no-datagen
          - mod_id: ciscala
            language: scala
            side: client
            extra: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: hustcer/setup-nu@v3
        with:
          version: '0.114.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: scaffold ${{ matrix.language }} ${{ matrix.side }} mod
        run: |
          cd "$RUNNER_TEMP"
          nu "$GITHUB_WORKSPACE/new-mc-mod.nu" \
            "${{ matrix.mod_id }}" \
            "dev.ci.${{ matrix.mod_id }}" \
            "CI ${{ matrix.language }} ${{ matrix.side }}" \
            --language "${{ matrix.language }}" \
            --side "${{ matrix.side }}" \
            --version "1.2.3" \
            --author "CI Author" \
            --license "Apache-2.0" \
            --description "Generated in CI." \
            ${{ matrix.extra }}
          cd "${{ matrix.mod_id }}"
          grep -F 'version = "1.2.3"' pkl/mod.pkl
          grep -F 'authors = new { "CI Author" }' pkl/mod.pkl
          grep -F 'license = "Apache-2.0"' pkl/mod.pkl
          grep -F 'description = "Generated in CI."' pkl/mod.pkl
          ! grep -RIlE 'com\.example\.modid|yourname|@@[A-Z_]+@@' .
          ./mcw build
          fabric_jar=$(find fabric/build/libs -name '*.jar' -print -quit)
          test -n "$fabric_jar"
          jar tf "$fabric_jar" | grep -F '${{ matrix.mod_id }}'

  generator-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-nu@v3
        with:
          version: '0.114.0'

      - name: reject invalid and occupied destinations
        run: |
          cd "$RUNNER_TEMP"
          mkdir occupied
          if occupied_output=$(nu "$GITHUB_WORKSPACE/new-mc-mod.nu" occupied dev.ci.occupied Occupied --author "CI Author" 2>&1); then
            echo "occupied destination unexpectedly succeeded"
            exit 1
          fi
          grep -F './occupied already exists' <<<"$occupied_output"

          if invalid_output=$(nu "$GITHUB_WORKSPACE/new-mc-mod.nu" Invalid-ID dev.ci.invalid Invalid --author "CI Author" 2>&1); then
            echo "invalid id unexpectedly succeeded"
            exit 1
          fi
          grep -F 'mod id must start with a lowercase letter' <<<"$invalid_output"

  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-nu@v3
        with:
          version: '0.114.0'

      - name: generate through standalone bootstrap
        env:
          MULTILOADER_TEMPLATE_REF: main
        run: |
          cd "$RUNNER_TEMP"
          nu "$GITHUB_WORKSPACE/create-mc-mod.nu" \
            cibootstrap \
            dev.ci.cibootstrap \
            "CI Bootstrap" \
            --language scala \
            --side client \
            --version "1.2.3" \
            --author "CI Author" \
            --license "Apache-2.0" \
            --description "Generated through the standalone bootstrap."
          test -n "$(find cibootstrap/common/src/main/scala -name ClientInit.scala -print -quit)"
          grep -F 'version = "1.2.3"' cibootstrap/pkl/mod.pkl
          grep -F 'authors = new { "CI Author" }' cibootstrap/pkl/mod.pkl

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - run: nix flake check ./template
      - run: nix develop ./template --command java -version
