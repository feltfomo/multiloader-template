# ci builds the scaffolded output because that is the project users receive
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: hustcer/setup-nu@v3
        with:
          version: '0.110.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: scaffold a throwaway mod and build it
        run: |
          cd "$RUNNER_TEMP"
          nu "$GITHUB_WORKSPACE/new-mc-mod.nu" cimod dev.cimod.test "CI Mod"
          cd cimod
          ./mcw build
