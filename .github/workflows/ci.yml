# ci builds generated projects because those are what users receive
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mod_id: cijava
            language: java
            side: both
            extra: ''
          - mod_id: cikotlin
            language: kotlin
            side: server
            extra: --no-datagen
          - mod_id: ciscala
            language: scala
            side: client
            extra: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: hustcer/setup-nu@v3
        with:
          version: '0.110.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: scaffold ${{ matrix.language }} ${{ matrix.side }} mod
        run: |
          cd "$RUNNER_TEMP"
          nu "$GITHUB_WORKSPACE/new-mc-mod.nu" \
            "${{ matrix.mod_id }}" \
            "dev.ci.${{ matrix.mod_id }}" \
            "CI ${{ matrix.language }} ${{ matrix.side }}" \
            --language "${{ matrix.language }}" \
            --side "${{ matrix.side }}" \
            ${{ matrix.extra }}
          cd "${{ matrix.mod_id }}"
          ./mcw build
