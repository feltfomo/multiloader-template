modLoader = "kotori_scala"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId      = "${mod_id}"
version    = "${mod_version}"
displayName = "${mod_name}"
description = '''${mod_description}'''
authors    = "${mod_authors}"
modEntry   = "com.example.modid.ModidNeoForge"

[[mixins]]
config = "modid.mixins.json"

[[mixins]]
config = "modid.client.mixins.json"

[[dependencies.${mod_id}]]
modId        = "neoforge"
type         = "required"
versionRange = "${neo_version_range}"
ordering     = "NONE"
side         = "BOTH"

[[dependencies.${mod_id}]]
modId        = "minecraft"
type         = "required"
versionRange = "${minecraft_version_range}"
ordering     = "NONE"
side         = "BOTH"
